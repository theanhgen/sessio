[package]
name = "sessio"
version = "1.0.0-alpha.10"
edition = "2021"
rust-version = "1.82"
description = "Interactive terminal browser to find and resume past Claude Code sessions."
license = "MIT"
repository = "https://github.com/theanhgen/sessio"

[[bin]]
name = "sessio"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# crossterm is used through ratatui's re-export so the two can never disagree on a version.
ratatui = "0.29"
unicode-width = "0.2"
# local-time formatting for the preview timestamps
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
