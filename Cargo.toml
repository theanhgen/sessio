[package]
name = "sessio"
version = "1.5.3"
edition = "2021"
rust-version = "1.89"
description = "Find the coding-agent session you left and pick it back up: a terminal dashboard and CLI for Claude Code and GitHub Copilot CLI sessions."
license = "MIT"
repository = "https://github.com/theanhgen/sessio"
homepage = "https://theanhgen.github.io/sessio/"
readme = "README.md"
keywords = ["claude", "claude-code", "copilot", "sessions", "tui"]
categories = ["command-line-utilities", "development-tools"]
# What crates.io gets: the program and what it compiles in (the notification icon, and the
# guidance tests' copies of the README, site and design notes). The npm launcher, the site, the
# legacy implementation and the release scripts stay in the repo.
include = [
    "/src/**",
    "/tests/**",
    "/docs/brand/icon-256.png",
    "/docs/index.html",
    "/docs/DESIGN.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/skills/**",
]

[[bin]]
name = "sessio"
path = "src/main.rs"

[lib]
name = "sessio"
path = "src/lib.rs"
# rlib for the binary, cdylib for the wasm demo the site runs.
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# Only the pure parts of ratatui — Line, Span, Style — are needed to build a frame. The terminal
# backend is a native-only concern, and crossterm does not compile for wasm at all.
ratatui = { version = "0.29", default-features = false }
unicode-width = "0.2"
# local-time formatting for the preview timestamps
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# crossterm is used through ratatui's re-export so the two can never disagree on a version.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
