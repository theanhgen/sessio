name: release

# Build the native binaries for every supported target, then publish the platform packages and
# the `sessio` launcher that depends on them. Publishing the launcher LAST matters: it pins
# exact versions of the platform packages, so it must never be installable before they exist.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and stage, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true # a partial matrix must not publish a half-supported release
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          # Built on the arm64 image, not macos-13: that is GitHub's last Intel image, its queue
          # runs to tens of minutes, and it is on the way out. Apple's toolchain cross-compiles
          # x86_64 from arm64 natively, so only the test and smoke steps are given up — both of
          # which the aarch64-apple-darwin job already runs against the same source.
          - target: x86_64-apple-darwin
            os: macos-14
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            musl: true
    steps:
      - uses: actions/checkout@v4

      - name: Install rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      # Gated on the target, not on `cross`: that flag means "this job cannot run what it built",
      # which is now also true of the macOS x86_64 job — and apt-get does not exist there.
      - name: Install cross-linker (aarch64 gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Test
        # Only the host-native targets can run their own tests.
        if: ${{ !matrix.cross }}
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify the binary runs
        if: ${{ !matrix.cross }}
        run: ./target/${{ matrix.target }}/release/sessio --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/sessio
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    environment: npm-publish
    permissions:
      contents: read
      # `npm publish --provenance` mints a signed attestation from a GitHub OIDC token. The
      # workflow-level `contents: read` sets every unlisted scope to none, so without this the
      # publish fails outright rather than silently publishing unsigned.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # The build jobs prove the binary works; nothing proved the launcher did. alpha.5 published
      # a `sessions` command that exited 0 without running anything, because the only path never
      # exercised — the bin symlink npm installs — is the one every user types.
      - name: Test the launcher
        run: npm test

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve version
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$version" ]]; then
              echo "tag v$tag does not match package.json version $version" >&2
              exit 1
            fi
          fi
          # npm points `latest` at whatever was published last unless told otherwise — it does
          # not read the version to notice a prerelease. Left to the default, 1.0.0-alpha.2
          # becomes what a plain `npm i -g sessio` installs. The dist-tag is derived from the
          # version instead: 1.0.0-alpha.2 -> alpha, 1.0.0 -> latest.
          if [[ "$version" == *-* ]]; then
            npm_tag="${version#*-}"
            npm_tag="${npm_tag%%.*}"
          else
            npm_tag=latest
          fi
          echo "publishing $version under dist-tag $npm_tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

      - name: Stage platform packages
        run: scripts/stage-npm-packages.sh "${{ steps.v.outputs.version }}" artifacts staged

      - name: Sanity-check the launcher against a staged binary
        run: |
          chmod +x staged/sessio-linux-x64/bin/sessio
          staged/sessio-linux-x64/bin/sessio --version

      # The launcher pins exact versions of the platform packages. Those are staged at THIS
      # release's version, so the pins must be rewritten to match — otherwise a version bump
      # publishes a launcher depending on the previous release's binaries, which either
      # installs stale binaries or fails to resolve.
      - name: Pin launcher to this release's platform packages
        run: |
          v='${{ steps.v.outputs.version }}'
          for dir in staged/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            npm pkg set "optionalDependencies.$name=$v"
          done
          node -e '
            const deps = require("./package.json").optionalDependencies || {};
            const v = process.argv[1];
            const wrong = Object.entries(deps).filter(([, got]) => got !== v);
            if (wrong.length) {
              console.error("optionalDependencies not pinned to " + v + ":", wrong);
              process.exit(1);
            }
            console.log("pinned " + Object.keys(deps).length + " platform packages to " + v);
          ' "$v"

      - name: Publish platform packages
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in staged/*/; do
            npm publish "$dir" --access public --provenance --tag "${{ steps.v.outputs.npm_tag }}"
          done

      # Last, so `sessio` is never resolvable before the binaries it pins.
      - name: Publish launcher
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag "${{ steps.v.outputs.npm_tag }}"

      - name: Dry-run summary
        if: ${{ github.event_name != 'push' && inputs.dry_run }}
        run: |
          echo "Dry run — staged but did not publish:" >> "$GITHUB_STEP_SUMMARY"
          ls -1 staged >> "$GITHUB_STEP_SUMMARY"
